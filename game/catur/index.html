<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Kaori Chess</title>

<style>
* {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  margin: 0;
  background: transparent;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #fff;
  overflow-x: hidden;
}

button {
  font: inherit;
}

.wrapper {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 12px;
}

.card {
  position: relative;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(104, 182, 255, 0.12),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      rgba(13, 22, 36, 0.98),
      rgba(7, 13, 23, 0.98)
    );

  border: 1px solid rgba(104, 182, 255, 0.55);
  border-radius: 24px;

  padding: 14px;

  box-shadow:
    0 20px 55px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

/* =========================
   HEADER
========================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
}

.brand {
  min-width: 0;
}

.title {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.8px;
  color: #68b6ff;
  text-transform: uppercase;
}

.title-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;

  border-radius: 50%;
  background: #39e58c;

  box-shadow:
    0 0 0 3px rgba(57, 229, 140, 0.08),
    0 0 12px rgba(57, 229, 140, 0.8);

  animation: pulse 1.5s infinite ease-in-out;
}

.subtitle {
  margin-top: 3px;

  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;

  color: #64748b;
  text-transform: uppercase;
}

.status {
  flex-shrink: 0;

  min-width: 88px;

  padding: 7px 10px;

  border: 1px solid rgba(104, 182, 255, 0.18);
  border-radius: 10px;

  background: rgba(255, 255, 255, 0.055);

  color: #dbeafe;

  font-size: 10px;
  font-weight: 800;
  text-align: center;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: 0.45;
    transform: scale(0.8);
  }
}

/* =========================
   CHESS BOARD
========================= */

.board-shell {
  position: relative;

  width: 100%;
  aspect-ratio: 1;

  padding: 5px;

  border-radius: 15px;

  background:
    linear-gradient(
      145deg,
      #1e3a5f,
      #0b1727
    );

  border: 1px solid rgba(104, 182, 255, 0.22);

  box-shadow:
    0 12px 30px rgba(0, 0, 0, 0.42),
    inset 0 0 0 1px rgba(255, 255, 255, 0.025);
}

#board-container {
  position: relative;

  width: 100%;
  height: 100%;

  border-radius: 10px;

  overflow: hidden;

  background: #0b1220;

  box-shadow:
    inset 0 0 25px rgba(0, 0, 0, 0.7);
}

#board {
  display: grid;

  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);

  width: 100%;
  height: 100%;
}

.sq {
  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  height: 100%;

  font-size: 30px;

  line-height: 1;

  cursor: pointer;

  overflow: hidden;

  transition:
    background .15s ease,
    transform .1s ease;
}
.sq:active {
  transform: scale(0.96);
}

/* Light square */
.sq.w {
  background:
    linear-gradient(
      135deg,
      #dcecff,
      #bdd5eb
    );
}

/* Dark square */
.sq.b {
  background:
    linear-gradient(
      135deg,
      #53728f,
      #3b5872
    );
}

/* Hover */
@media (hover: hover) {
  .sq:hover {
    filter: brightness(1.08);
  }
}

/* =========================
   MOVE HIGHLIGHT
========================= */

.sq.hl::after {
  content: "";

  position: absolute;

  width: 25%;
  height: 25%;

  border-radius: 50%;

  background: rgba(32, 104, 155, 0.75);

  box-shadow:
    0 0 0 3px rgba(255, 255, 255, 0.08);
}

.sq.sel {
  background:
    linear-gradient(
      135deg,
      #68b6ff,
      #3588d4
    ) !important;

  box-shadow:
    inset 0 0 0 3px rgba(255, 255, 255, 0.22),
    inset 0 0 25px rgba(0, 0, 0, 0.18);
}

.sq.last-move {
  background:
    linear-gradient(
      135deg,
      rgba(104, 182, 255, 0.72),
      rgba(55, 130, 196, 0.72)
    ) !important;

  box-shadow:
    inset 0 0 18px rgba(0, 0, 0, 0.2);
}

.sq.check {
  background:
    radial-gradient(
      circle,
      #ff6868,
      #d93636
    ) !important;

  animation: checkPulse 0.8s infinite alternate;
}

@keyframes checkPulse {
  from {
    box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.15);
  }

  to {
    box-shadow:
      inset 0 0 28px rgba(255, 80, 80, 0.8);
  }
}

/* =========================
   CHESS PIECES
========================= */

.sq span {
  font-family:
    "Noto Sans Symbols 2",
    "Segoe UI Symbol",
    "DejaVu Sans",
    sans-serif;
}

.sq:hover span {
  transform: scale(1.04);
}

.piece-moved {
  animation:
    pieceDrop
    0.3s
    cubic-bezier(0.175, 0.885, 0.32, 1.275)
    forwards;
}

@keyframes pieceDrop {
  0% {
    transform:
      scale(1.35)
      translateY(-8px);

    opacity: 0.35;
  }

  70% {
    transform:
      scale(0.96)
      translateY(2px);

    opacity: 1;
  }

  100% {
    transform:
      scale(1)
      translateY(0);
  }
}

/* =========================
   GAME OVERLAY
========================= */

#game-overlay {
  display: none;

  position: absolute;

  inset: 0;

  z-index: 10;

  flex-direction: column;
  align-items: center;
  justify-content: center;

  background:
    rgba(4, 10, 18, 0.82);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);

  animation: overlayIn 0.25s ease;
}

@keyframes overlayIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.overlay-badge {
  width: 54px;
  height: 54px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 12px;

  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      #68b6ff,
      #2773b7
    );

  border: 1px solid rgba(255, 255, 255, 0.15);

  box-shadow:
    0 10px 25px rgba(0, 0, 0, 0.35);
}

.overlay-badge span {
  font-size: 25px;
}

#overlay-msg {
  font-size: 21px;
  font-weight: 950;

  color: #fff;

  text-align: center;

  letter-spacing: 0.5px;

  text-shadow:
    0 4px 15px rgba(0, 0, 0, 0.5);
}

.reset-btn {
  margin-top: 15px;

  padding: 9px 15px;

  border: 1px solid rgba(104, 182, 255, 0.3);
  border-radius: 10px;

  background: rgba(104, 182, 255, 0.1);

  color: #8dceff;

  font-size: 10px;
  font-weight: 900;

  letter-spacing: 0.7px;

  cursor: pointer;

  transition: 0.2s ease;
}

.reset-btn:active {
  transform: scale(0.94);
}

/* =========================
   CONTROL PANEL
========================= */

.control-label {
  margin-top: 13px;
  margin-bottom: 7px;

  color: #64748b;

  font-size: 8px;
  font-weight: 900;

  letter-spacing: 1.2px;

  text-transform: uppercase;
}

.controls {
  display: grid;

  grid-template-columns: 1fr 1fr 0.75fr;

  gap: 7px;
}

.btn {
  min-height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 5px;

  padding: 8px;

  border: 1px solid rgba(255, 255, 255, 0.07);

  border-radius: 11px;

  color: #e5edf8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    filter 0.15s ease,
    box-shadow 0.15s ease,
    border 0.15s ease;
}

.btn:active {
  transform: scale(0.95);
}

.btn:hover {
  filter: brightness(1.08);
}

.btn-ai {
  background:
    linear-gradient(
      135deg,
      #255d91,
      #16446d
    );
}

.btn-pvp {
  background:
    linear-gradient(
      135deg,
      #244c70,
      #173650
    );
}

.btn-reset {
  background:
    linear-gradient(
      135deg,
      #753e4a,
      #522d36
    );
}

.btn.active {
  border-color: rgba(104, 182, 255, 0.8);

  box-shadow:
    0 0 0 2px rgba(104, 182, 255, 0.12),
    0 5px 18px rgba(104, 182, 255, 0.14);

  color: #fff;
}
/* =========================
   CHESS PIECES
========================= */

.piece {
  position: relative;
  z-index: 5;

  display: block;

  font-family:
    "Segoe UI Symbol",
    "Noto Sans Symbols 2",
    "DejaVu Sans",
    sans-serif;

  font-size: clamp(27px, 8.8vw, 45px);

  line-height: 1;

  pointer-events: none;

  transform: translateZ(0);

  transition:
    transform .15s ease,
    filter .15s ease;
}

/* WHITE */

.white-piece {
  color: #ffffff;

  text-shadow:
    0 2px 0 #64748b,
    0 3px 5px rgba(0,0,0,.65),
    0 0 2px rgba(0,0,0,.8);

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

/* BLACK */

.black-piece {
  color: #111827;

  text-shadow:
    0 1px 0 rgba(255,255,255,.45),
    0 2px 3px rgba(0,0,0,.4);

  filter:
    drop-shadow(0 2px 2px rgba(0,0,0,.3));
}

.sq:hover .piece {
  transform: scale(1.06);
}

/* MOVE ANIMATION */

.piece-moved {
  animation:
    pieceDrop
    .32s
    cubic-bezier(.175,.885,.32,1.275)
    forwards;
}

@keyframes pieceDrop {

  0% {
    opacity: .25;
    transform:
      scale(1.35)
      translateY(-8px);
  }

  65% {
    opacity: 1;
    transform:
      scale(.96)
      translateY(2px);
  }

  100% {
    opacity: 1;
    transform:
      scale(1)
      translateY(0);
  }

}
/* =========================
   FOOTER
========================= */

.credit-bar {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 4px;

  margin-top: 12px;
  padding-top: 9px;

  border-top:
    1px dashed
    rgba(255, 255, 255, 0.1);

  color: #64748b;

  font-size: 8px;
  font-weight: 800;

  letter-spacing: 1.2px;

  text-transform: uppercase;
}

.credit-bar span {
  color: #68b6ff;

  text-shadow:
    0 0 12px
    rgba(104, 182, 255, 0.5);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 360px) {
  .wrapper {
    padding: 8px;
  }

  .card {
    padding: 10px;
    border-radius: 20px;
  }

  .status {
    min-width: 78px;
    font-size: 9px;
  }

  .controls {
    gap: 5px;
  }

  .btn {
    min-height: 39px;
    font-size: 9px;
  }
}
</style>

<body>

<div class="wrapper">

  <div class="card">

    <!-- HEADER -->
    <div class="header">

      <div class="brand">

        <div class="title">
          <span class="title-dot"></span>
          KAORI-MINI CHESS
        </div>

        <div class="subtitle">
          Classic Chess Engine
        </div>

      </div>

      <div
        class="status"
        id="status"
      >
        White Turn
      </div>

    </div>


    <!-- BOARD -->
    <div class="board-shell">

      <div id="board-container">

        <div id="board"></div>


        <!-- GAME OVER -->
        <div id="game-overlay">

          <div class="overlay-badge">
            <span>♛</span>
          </div>

          <div id="overlay-msg"></div>

          <div
            class="reset-btn"
            id="overlay-reset"
          >
            ↻ PLAY AGAIN
          </div>

        </div>

      </div>

    </div>


    <!-- CONTROLS -->
    <div class="control-label">
      Game Mode
    </div>

    <div class="controls">

      <button
        class="btn btn-ai active"
        id="btn-ai"
      >
        🤖 AI AUTO
      </button>

      <button
        class="btn btn-pvp"
        id="btn-pvp"
      >
        ♙ 2 PLAYER
      </button>

      <button
        class="btn btn-reset"
        id="btn-reset"
      >
        ↻ RESET
      </button>

    </div>


    <!-- CREDIT -->
    <div class="credit-bar">
      Engineered by
      <span>KAORI-MD</span>
      ⚡
    </div>

  </div>

</div>

<!-- =========================================================
     GAME LOGIC
========================================================= -->

<script>
(function() {

  var game = new Chess();

  var boardEl =
    document.getElementById("board");

  var statusEl =
    document.getElementById("status");

  var mode = "ai";

  var selectedSq = null;

  var validMoves = [];

  var lastMove = null;


  var pieceUnicode = {
  w: {
    k: "♔",
    q: "♕",
    r: "♖",
    b: "♗",
    n: "♘",
    p: "♙"
  },

  b: {
    k: "♚",
    q: "♛",
    r: "♜",
    b: "♝",
    n: "♞",
    p: "♟"
  }
};


  /* =========================
     RENDER BOARD
  ========================= */

  function render() {

    boardEl.innerHTML = "";

    var board = game.board();

    var inCheck =
      game.in_check();

    var turn =
      game.turn();


    for (var r = 0; r < 8; r++) {

      for (var c = 0; c < 8; c++) {

        var sqId =
          String.fromCharCode(97 + c)
          + (8 - r);


        var cell =
          document.createElement("div");

        cell.className =
          "sq " +
          ((r + c) % 2 === 0
            ? "w"
            : "b");


        cell.dataset.sq =
          sqId;


        /* selected */
        if (selectedSq === sqId) {
          cell.classList.add("sel");
        }


        /* valid moves */
        if (
          validMoves.some(
            function(m) {
              return m.to === sqId;
            }
          )
        ) {
          cell.classList.add("hl");
        }


        /* last move */
        if (
          lastMove &&
          (
            lastMove.from === sqId ||
            lastMove.to === sqId
          )
        ) {
          cell.classList.add("last-move");
        }


        var p =
          board[r][c];


if (p) {

  var span = document.createElement("span");

  span.className =
    p.color === "w"
      ? "piece white-piece"
      : "piece black-piece";

  span.textContent =
    pieceUnicode[p.color][p.type];

  /*
   * Animasi bidak yang baru bergerak
   */
  if (
    lastMove &&
    lastMove.to === sqId
  ) {
    span.classList.add("piece-moved");
  }

  cell.appendChild(span);

  /*
   * King sedang check
   */
  if (
    p.type === "k" &&
    p.color === turn &&
    inCheck
  ) {
    cell.classList.add("check");
  }
}

        cell.onclick =
          (function(sq) {

            return function() {

              handleSquareClick(sq);

            };

          })(sqId);


        boardEl.appendChild(cell);

      }

    }


    updateStatus();

  }


  /* =========================
     STATUS
  ========================= */

  function updateStatus() {

    var st = "";

    var moveColor =
      game.turn() === "w"
        ? "White"
        : "Black";


    var over = false;

    var overMsg = "";


    if (game.in_checkmate()) {

      st =
        moveColor +
        " Checkmated!";


      var winner =
        game.turn() === "w"
          ? "BLACK"
          : "WHITE";


      overMsg =
        winner +
        " WINS! 🏆";


      over = true;


    } else if (game.in_draw()) {

      st = "Draw";

      overMsg =
        "MATCH DRAW! 🤝";

      over = true;


    } else {

      st =
        moveColor +
        " Turn";


      if (game.in_check()) {

        st +=
          " • Check";

      }

    }


    statusEl.textContent =
      st;


    var overlay =
      document.getElementById(
        "game-overlay"
      );


    if (over) {

      document.getElementById(
        "overlay-msg"
      ).textContent =
        overMsg;

      overlay.style.display =
        "flex";

    } else {

      overlay.style.display =
        "none";

    }

  }


  /* =========================
     AI EVALUATION
  ========================= */

  function evaluateBoard() {

    var pieceValues = {

      "p": 10,
      "n": 30,
      "b": 30,
      "r": 50,
      "q": 90,
      "k": 900

    };


    var score = 0;

    var board =
      game.board();


    for (var r = 0; r < 8; r++) {

      for (var c = 0; c < 8; c++) {

        var p =
          board[r][c];


        if (p) {

          var val =
            pieceValues[p.type];


          if (p.color === "w") {

            score -= val;

          } else {

            score += val;

          }

        }

      }

    }


    return score;

  }


  /* =========================
     AI MOVE
  ========================= */

  function makeRandomMove() {

    if (
      mode !== "ai" ||
      game.turn() !== "b" ||
      game.game_over()
    ) {
      return;
    }


    var moves =
      game.moves({
        verbose: true
      });


    if (!moves.length) {
      return;
    }


    moves.sort(
      function() {
        return Math.random() - 0.5;
      }
    );


    var bestMove =
      moves[0];

    var bestScore =
      -9999;


    for (
      var i = 0;
      i < moves.length;
      i++
    ) {

      var m =
        moves[i];


      game.move(m);


      var score =
        evaluateBoard();


      if (
        game.in_checkmate()
      ) {

        score += 1000;

      }


      game.undo();


      if (
        score > bestScore
      ) {

        bestScore =
          score;

        bestMove =
          m;

      }

    }


    lastMove =
      game.move(bestMove);


    render();

  }


  /* =========================
     CLICK SQUARE
  ========================= */

  function handleSquareClick(sq) {

    if (
      game.game_over()
    ) {
      return;
    }


    /* AI is thinking */

    if (
      mode === "ai" &&
      game.turn() === "b"
    ) {
      return;
    }


    if (selectedSq) {

      var move =
        game.move({

          from:
            selectedSq,

          to:
            sq,

          promotion:
            "q"

        });


      if (move === null) {

        var p =
          game.get(sq);


        if (
          p &&
          p.color === game.turn()
        ) {

          selectedSq =
            sq;

          validMoves =
            game.moves({

              square:
                sq,

              verbose:
                true

            });

        } else {

          selectedSq =
            null;

          validMoves =
            [];

        }


      } else {

        lastMove =
          move;


        selectedSq =
          null;

        validMoves =
          [];


        render();


        if (
          mode === "ai" &&
          !game.game_over()
        ) {

          setTimeout(
            makeRandomMove,
            450
          );

        }

      }


    } else {

      var p =
        game.get(sq);


      if (
        p &&
        p.color === game.turn()
      ) {

        selectedSq =
          sq;

        validMoves =
          game.moves({

            square:
              sq,

            verbose:
              true

          });

      }

    }


    render();

  }


  /* =========================
     AI BUTTON
  ========================= */

  document.getElementById(
    "btn-ai"
  ).onclick =
    function() {

      mode = "ai";


      this.classList.add(
        "active"
      );


      document.getElementById(
        "btn-pvp"
      ).classList.remove(
        "active"
      );


      if (
        game.turn() === "b" &&
        !game.game_over()
      ) {

        setTimeout(
          makeRandomMove,
          450
        );

      }

    };


  /* =========================
     PVP BUTTON
  ========================= */

  document.getElementById(
    "btn-pvp"
  ).onclick =
    function() {

      mode = "pvp";


      this.classList.add(
        "active"
      );


      document.getElementById(
        "btn-ai"
      ).classList.remove(
        "active"
      );

    };


  /* =========================
     RESET
  ========================= */

  function resetGame() {

    game.reset();

    selectedSq =
      null;

    validMoves =
      [];

    lastMove =
      null;


    document.getElementById(
      "game-overlay"
    ).style.display =
      "none";


    render();

  }


  document.getElementById(
    "btn-reset"
  ).onclick =
    resetGame;


  document.getElementById(
    "overlay-reset"
  ).onclick =
    resetGame;


  /* INITIALIZE */

  render();

})();
</script>

</body>
</html>
